<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FAQ Chatbot</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .chat-container {

            width: 400px;

            max-width: 95%;

            height: 600px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.2);

            display: flex;

            flex-direction: column;

            overflow: hidden;
        }


        .chat-header {

            background: #667eea;

            color: white;

            padding: 20px;

            text-align: center;
        }


        .chat-header h1 {

            font-size: 22px;

            margin-bottom: 5px;
        }


        .chat-header p {

            font-size: 13px;
        }


        .chat-box {

            flex: 1;

            padding: 20px;

            overflow-y: auto;

            background: #f5f5f5;
        }


        .message {

            max-width: 80%;

            padding: 12px 15px;

            margin-bottom: 15px;

            border-radius: 15px;

            line-height: 1.5;

            font-size: 14px;
        }


        .bot {

            background: white;

            color: #333;

            border: 1px solid #ddd;

            margin-right: auto;
        }


        .user {

            background: #667eea;

            color: white;

            margin-left: auto;
        }


        .input-area {

            display: flex;

            padding: 15px;

            background: white;

            border-top: 1px solid #ddd;
        }


        #userInput {

            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 10px;

            outline: none;

            font-size: 14px;
        }


        #sendButton {

            margin-left: 10px;

            padding: 12px 18px;

            border: none;

            border-radius: 10px;

            background: #667eea;

            color: white;

            cursor: pointer;

            font-weight: bold;
        }


        #sendButton:hover {

            background: #5568d8;
        }

    </style>

</head>


<body>


    <div class="chat-container">


        <div class="chat-header">

            <h1>🤖 FAQ Chatbot</h1>

            <p>Ask me anything about the college</p>

        </div>


        <div class="chat-box" id="chatBox">


            <div class="message bot">

                Hello! 👋<br>

                I am your FAQ chatbot.

                How can I help you?

            </div>


        </div>


        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                onkeypress="handleKeyPress(event)"
            >


            <button
                id="sendButton"
                onclick="sendMessage()">

                Send

            </button>

        </div>


    </div>


    <script>


        async function sendMessage() {


            const input =
                document.getElementById("userInput");


            const message =
                input.value.trim();


            if (message === "") {

                return;

            }


            // Display user message

            addMessage(message, "user");


            input.value = "";


            // Display typing message

            addMessage("Typing...", "bot");


            try {


                const response =
                    await fetch("/chat", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })

                    });


                const data =
                    await response.json();


                // Remove typing message

                const chatBox =
                    document.getElementById("chatBox");


                chatBox.removeChild(
                    chatBox.lastElementChild
                );


                // Display bot response

                addMessage(
                    data.answer,
                    "bot"
                );


            } catch (error) {


                console.error(error);


                addMessage(
                    "Sorry, something went wrong.",
                    "bot"
                );

            }

        }


        function addMessage(text, sender) {


            const chatBox =
                document.getElementById("chatBox");


            const message =
                document.createElement("div");


            message.classList.add(
                "message",
                sender
            );


            message.innerText = text;


            chatBox.appendChild(message);


            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        function handleKeyPress(event) {


            if (event.key === "Enter") {

                sendMessage();

            }

        }


    </script>


</body>

</html>
